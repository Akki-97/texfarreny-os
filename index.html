<style>

async function abrir(k){
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)));
  try{sessionStorage.setItem(K,btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",k)))))}catch(e){}
  document.open();document.write(html);document.close();
}
const derivar=async p=>crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},
  await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]),
  {name:"AES-GCM",length:256},true,["decrypt"]);
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();
  if(!window.crypto||!crypto.subtle){document.getElementById("e").textContent="Este navegador no puede abrir la página: hace falta abrirla por https.";return}const b=ev.target.querySelector("button");b.disabled=true;b.textContent="Abriendo…";
  try{await abrir(await derivar(document.getElementById("k").value))}catch(e){document.getElementById("e").textContent="Contraseña incorrecta.";b.disabled=false;b.textContent="Entrar"}};
(async()=>{let g=null;try{g=sessionStorage.getItem(K)}catch(e){}
  if(!g) return;
  const f=document.getElementById("f"),w=document.getElementById("w"); f.hidden=true; w.hidden=false;
  // Al recargar, esta pantalla aún se está cargando: si se reescribe ahora, el
  // navegador puede mezclar las dos páginas. Se espera a que termine.
  if(document.readyState!=="complete") await new Promise(r=>addEventListener("load",r,{once:true}));
  try{await abrir(await crypto.subtle.importKey("raw",u(g),"AES-GCM",false,["decrypt"]))}
  catch(e){try{sessionStorage.removeItem(K)}catch(x){} w.hidden=true; f.hidden=false;}})();
</script></body></html>

const u=b=>Uint8Array.from(atob(b),x=>x.charCodeAt(0));
async function abrir(p){
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},
    await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]),
    {name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)));
  try{sessionStorage.setItem("tf-k",p)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector("button");b.disabled=true;b.textContent="Abriendo…";
  try{await abrir(document.getElementById("k").value)}catch(e){document.getElementById("e").textContent="Contraseña incorrecta.";b.disabled=false;b.textContent="Entrar"}};
